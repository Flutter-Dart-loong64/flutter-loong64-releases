loongarch_changes:
  flutter:
    summary:
      - Linux loong64 target plumbing.
      - Linux OpenGL compositor fallback for LoongGPU.
  sdk:
    summary:
      - Loong64 Dart SDK and VM support.
  engine:
    summary:
      - Loong64 Flutter engine support.
  native:
    summary:
      - Loong64 native asset target support.

build:
  dart_sdk: required
  flutter_engine: required
  flutter_sdk: required
  engine_options:
